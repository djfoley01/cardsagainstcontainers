# Cards Against Containers
#
# IMPORTANT: this application must run as exactly ONE replica.
#
# Every game room lives in the pod's memory — a deliberate design choice that
# removes the need for a database entirely. With two replicas, players joining
# the same room code can be routed to different pods and silently end up in
# different games, with no error to tell them so.
#
# The chart refuses to render with replicaCount > 1 rather than let that
# happen quietly. If you ever genuinely need to scale out, the application has
# to move its room state into Redis first.

replicaCount: 1

image:
  repository: docker.io/djfoley01/cards-against-containers

  # Empty means .Chart.AppVersion, which is pinned to a released tag rather
  # than `latest`. A `latest` tag also exists on the registry, but floating it
  # here would make it impossible to tell what is actually running, and a pull
  # that silently changed the image would end every game in progress the next
  # time the pod restarted. Set it explicitly to override.
  tag: ""

  # The registry is public, so an unauthenticated cluster can pull it — but
  # Docker Hub rate-limits anonymous pulls per egress IP and a corporate
  # cluster's budget is usually already spent. If pods land in
  # ImagePullBackOff with `toomanyrequests`, add a pull secret; see
  # docs/building.md.
  #
  # On OpenShift the integrated registry avoids Docker Hub entirely:
  #   image-registry.openshift-image-registry.svc:5000/<namespace>/cards-against-containers
  #
  # Published 2026-09-22, amd64 only. This is the digest the
  # registry serves, not podman's first RepoDigest, which can be a local-only
  # manifest that does not pull.
  #   sha256:4ec26221f6d115f01ed84b87e8d174c42bbfc489e2f261b21737f9a316fdfb8b
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The port the app listens on inside the pod. Anything >= 1024 works; the
# container runs as a non-root user and cannot bind a privileged port, so 80
# or 443 will fail with EACCES. Change this rather than setting PORT through
# extraEnv, which would leave the probes pointing at the wrong port.
containerPort: 3000

service:
  type: ClusterIP
  port: 8080       # service port, independent of containerPort

# OpenShift Route. Leave enabled on OpenShift; use ingress instead on plain
# Kubernetes.
route:
  enabled: true
  host: ""                 # empty lets OpenShift generate one
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  annotations:
    # Two different timeouts apply, and confusing them is easy:
    #
    #   timeout        -> HAProxy `timeout server`, for ordinary HTTP
    #                     requests. Cluster default 30s
    #                     (ROUTER_DEFAULT_SERVER_TIMEOUT).
    #   timeout-tunnel -> HAProxy `timeout tunnel`, which is what governs a
    #                     connection *after* it upgrades to a WebSocket.
    #                     Cluster default 1h (ROUTER_DEFAULT_TUNNEL_TIMEOUT).
    #
    # The game's socket lives under timeout-tunnel, not timeout, so the 30s
    # HTTP default was never a threat to it. Both are set explicitly anyway:
    # the cluster defaults are only defaults, and a platform team that lowered
    # ROUTER_DEFAULT_TUNNEL_TIMEOUT would otherwise disconnect every player on
    # a silent schedule.
    #
    # Do not set this low. A short tunnel timeout does not fail gracefully so
    # much as churn: every player is disconnected on that cycle, reconnects,
    # and rejoins. The game survives it — seats and scores are held — but it is
    # visible and pointless. 1h comfortably outlasts a happy hour.
    haproxy.router.openshift.io/timeout: 30s
    haproxy.router.openshift.io/timeout-tunnel: 1h

# Plain Kubernetes ingress. Mutually exclusive with route.
ingress:
  enabled: false
  className: ""
  host: cards.example.com
  annotations:
    # Most ingress controllers need a raised timeout for long-lived
    # WebSockets; these are the nginx-ingress keys.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls: []

# Custom decks, mounted into the container and picked up without a restart.
#
# The built-in decks always ship in the image; these are additional. The server
# watches this directory, so adding a deck mid-evening updates lobbies in place
# instead of restarting and ending every game in progress.
#
# Use the deck builder at /decks in the running app to write a deck and copy
# out ready-to-apply ConfigMap YAML.
customDecks:
  # Mount an existing ConfigMap whose keys are <name>.json.
  #   oc create configmap cac-custom-decks --from-file=myteam.json
  configMap: ""

  # Or mount a PersistentVolumeClaim, if you want decks to be writable and to
  # outlive the ConfigMap's 1 MiB ceiling. Only one of these may be set.
  persistentVolumeClaim: ""

  # Where they are mounted. The server reads CAC_DECK_DIRS, which the chart
  # sets to this path.
  mountPath: /decks/custom

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Left empty by default because OpenShift's restricted-v2 SCC assigns an
# arbitrary UID from the namespace range, and hardcoding runAsUser here would
# be rejected. On plain Kubernetes you may want runAsUser: 1000.
podSecurityContext: {}

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: false   # Node writes to /tmp

env:
  logLevel: info
  # Comma-separated origins for the game socket, or empty to allow same-origin.
  corsOrigin: ""

extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
