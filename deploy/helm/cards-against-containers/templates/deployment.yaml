{{- include "cac.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cac.fullname" . }}
  labels:
    {{- include "cac.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: a rolling update briefly runs two pods, and
  # players reaching the new one would not find the room hosted by the old.
  # A few seconds of downtime between happy hours is the better trade.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cac.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cac.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cac.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The server handles SIGTERM itself and closes sockets cleanly, so this
      # only needs to cover in-flight requests.
      terminationGracePeriodSeconds: 30
      containers:
        - name: game
          image: {{ include "cac.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            {{- if .Values.env.corsOrigin }}
            - name: CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Generous: a liveness restart wipes every in-progress game, so it
            # should only fire for a genuinely wedged process.
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
